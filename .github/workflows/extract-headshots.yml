name: Extract team headshots
on:
  push:
    paths:
      - '.github/workflows/extract-headshots.yml'
      - 'bramwellbell-headshots.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract images
        run: unzip -o bramwellbell-headshots.zip -d .
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add local team headshot assets"
            git push
          fi
